<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
  <title id="title">Read-only SQL MCP AI Assistant - POC Architecture</title>
  <desc id="desc">Management architecture showing business user, chat UI, Spring Boot AI application, OpenAI API, secure MCP tool boundary, Data API Builder, and read-only SQL Server access.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0e8088"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#10739e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #475569; }
      .band { font-size: 13px; font-weight: 700; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-body { font-size: 12px; }
      .app-title { font-size: 17px; font-weight: 700; fill: #1b5e20; }
      .small { font-size: 10px; }
      .future { fill: #5b6472; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #2e7d32; stroke-width: 2; marker-end: url(#arrowGreen); }
      .edge-teal { fill: none; stroke: #0e8088; stroke-width: 2; marker-end: url(#arrowTeal); }
      .edge-blue { fill: none; stroke: #10739e; stroke-width: 2; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1450" height="900" fill="#ffffff"/>
  <text x="60" y="50" class="title">Read-only SQL MCP AI Assistant - POC Architecture</text>
  <text x="60" y="80" class="subtitle">Management view: natural-language questions, OpenAI model orchestration, secure MCP boundary, approved read-only data access</text>

  <text x="255" y="342" text-anchor="middle" class="band" fill="#3f5f91">User Experience</text>
  <rect x="70" y="390" width="150" height="70" rx="6" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="145" y="431" text-anchor="middle" class="box-title">Business User</text>

  <rect x="270" y="390" width="170" height="70" rx="6" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="355" y="419" text-anchor="middle" class="box-title">Chat UI</text>
  <text x="355" y="441" text-anchor="middle" class="box-body" fill="#475569">Natural language Q&amp;A</text>

  <rect x="250" y="230" width="210" height="86" rx="6" fill="#f3f4f6" stroke="#8a8f98" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="355" y="260" text-anchor="middle" class="box-title future">Authentication / OIDC</text>
  <text x="355" y="283" text-anchor="middle" class="box-body future">Future production capability</text>
  <text x="355" y="302" text-anchor="middle" class="box-body future">Not in current POC</text>

  <rect x="500" y="190" width="420" height="470" rx="6" fill="#f4fbf6" stroke="#2e7d32" stroke-width="3"/>
  <text x="510" y="220" class="app-title">Spring Boot AI Application</text>

  <rect x="535" y="250" width="160" height="58" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="615" y="275" text-anchor="middle" class="box-title">ChatController</text>
  <text x="615" y="295" text-anchor="middle" class="box-body" fill="#33691e">Request validation</text>

  <rect x="725" y="250" width="165" height="58" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="807.5" y="275" text-anchor="middle" class="box-title">ChatCoordinator</text>
  <text x="807.5" y="295" text-anchor="middle" class="box-body" fill="#33691e">Controls chat turn</text>

  <rect x="535" y="340" width="355" height="135" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="712.5" y="364" text-anchor="middle" class="box-title">Safety &amp; Governance Controls</text>
  <text x="712.5" y="387" text-anchor="middle" class="box-body" fill="#33691e">PII Detection</text>
  <text x="712.5" y="406" text-anchor="middle" class="box-body" fill="#33691e">Request Token Context</text>
  <text x="712.5" y="425" text-anchor="middle" class="box-body" fill="#33691e">Secure MCP Tool Boundary</text>
  <text x="712.5" y="444" text-anchor="middle" class="box-body" fill="#33691e">Tool Result Protection</text>
  <text x="712.5" y="462" text-anchor="middle" class="small" fill="#4f6f37">PiiDetector - SensitiveRequestContext</text>
  <text x="712.5" y="474" text-anchor="middle" class="small" fill="#4f6f37">SecureMcpToolCallback - SensitivePayloadProtector</text>

  <rect x="535" y="500" width="355" height="58" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="712.5" y="525" text-anchor="middle" class="box-title">PromptProvider + ChatModelRunner</text>
  <text x="712.5" y="545" text-anchor="middle" class="box-body" fill="#33691e">System prompt - guarded tools</text>

  <rect x="535" y="580" width="165" height="58" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="617.5" y="605" text-anchor="middle" class="box-title">Structured Response</text>
  <text x="617.5" y="625" text-anchor="middle" class="box-body" fill="#33691e">Status - rows - notes</text>

  <rect x="725" y="580" width="165" height="58" rx="6" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="807.5" y="602" text-anchor="middle" class="box-title">Sanitized</text>
  <text x="807.5" y="620" text-anchor="middle" class="box-title">Conversation Memory</text>
  <text x="807.5" y="636" text-anchor="middle" class="small" fill="#33691e">Protected follow-up context</text>

  <text x="1070" y="342" text-anchor="middle" class="band" fill="#7f6000">Model Provider</text>
  <rect x="960" y="365" width="220" height="86" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="1070" y="393" text-anchor="middle" class="box-title">OpenAI API</text>
  <text x="1070" y="417" text-anchor="middle" class="box-body" fill="#7f6000">Primary: gpt-4.1-mini</text>
  <text x="1070" y="437" text-anchor="middle" class="box-body" fill="#7f6000">Fallback: gpt-4.1-nano</text>

  <rect x="970" y="535" width="200" height="58" fill="#fdecea" stroke="#c62828" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1070" y="560" text-anchor="middle" class="box-title" fill="#b71c1c">LLM has no direct</text>
  <text x="1070" y="580" text-anchor="middle" class="box-title" fill="#b71c1c">database access</text>

  <text x="1305" y="342" text-anchor="middle" class="band" fill="#0e5c61">Data Access</text>
  <rect x="1220" y="365" width="190" height="80" rx="6" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="1315" y="398" text-anchor="middle" class="box-title">DAB MCP Tools</text>
  <text x="1315" y="421" text-anchor="middle" class="box-body" fill="#0e5c61">describe - read - aggregate</text>

  <rect x="830" y="690" width="230" height="80" rx="6" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="945" y="724" text-anchor="middle" class="box-title">Microsoft Data API Builder</text>
  <text x="945" y="747" text-anchor="middle" class="box-body" fill="#0e5c61">Controlled data API</text>

  <path d="M570 695 C570 668,760 668,760 695 L760 765 C760 792,570 792,570 765 Z" fill="#cfe8f6" stroke="#10739e" stroke-width="2"/>
  <ellipse cx="665" cy="695" rx="95" ry="27" fill="#d9eef8" stroke="#10739e" stroke-width="2"/>
  <text x="665" y="725" text-anchor="middle" class="box-title">SQL Server</text>
  <text x="665" y="748" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only access</text>

  <path class="edge" d="M220 425 L270 425"/>
  <path class="edge" d="M440 425 L480 425 L480 279 L535 279"/>
  <path class="edge" d="M695 279 L725 279"/>
  <path class="edge-green" d="M807 308 L807 324 L713 324 L713 340"/>
  <path class="edge-green" d="M713 475 L713 500"/>
  <path class="edge" d="M890 529 L940 529 L940 408 L960 408"/>
  <path class="edge" d="M1180 408 L1220 405"/>
  <path class="edge-teal" d="M1315 445 L1315 640 L945 640 L945 690"/>
  <path class="edge-blue" d="M830 730 L760 730"/>
  <path d="M355 316 L355 390" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="785" y="721" width="66" height="20" fill="#ffffff" stroke="none"/>
  <text x="818" y="736" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only</text>
</svg>
